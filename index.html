<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="mobile-web-app-capable" content="yes">
<title>Grimo</title>
<link rel="manifest" href="manifest.json">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
html, body { width: 100vw; height: 100vh; background: #000000; overflow: hidden; position: fixed; }
#screen { width: 100vw; height: 100vh; background: #000000; position: relative; }
#video { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); opacity: 0; transition: opacity 0.3s; pointer-events: none; }
#video.show { opacity: 1; }
.tone-0 { filter: none; }
.tone-1 { filter: sepia(0.18) saturate(1.15) brightness(1.05) hue-rotate(-8deg); }
.tone-2 { filter: blur(0.6px) brightness(1.08) contrast(0.92); }
.tone-3 { filter: brightness(1.15) saturate(1.18) contrast(0.95); }
.tone-4 { filter: sepia(0.15) saturate(1.1) brightness(1.08) contrast(0.92) blur(0.4px) hue-rotate(-5deg); }
#picker { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 100; padding: 24px; }
#picker.show { display: flex; }
#picker .label { color: #555; font-size: 12px; margin-bottom: 16px; }
.tone-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.tone-btn { background: rgba(255,255,255,0.05); color: #888; border: 1px solid rgba(255,255,255,0.1); padding: 14px 18px; border-radius: 24px; font-size: 13px; }
.tone-btn.active { background: rgba(255,255,255,0.18); color: #fff; border-color: rgba(255,255,255,0.3); }
#preview { width: 100%; max-width: 320px; aspect-ratio: 9/16; background: #000; border-radius: 12px; overflow: hidden; }
#previewVideo { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
#close { margin-top: 16px; color: #444; font-size: 11px; }
</style>
</head>
<body>
<div id="screen"></div>
<video id="video" autoplay playsinline muted></video>
<div id="picker">
<div class="label">선호 톤 선택</div>
<div id="preview"><video id="previewVideo" autoplay playsinline muted></video></div>
<div class="tone-row">
<button class="tone-btn" data-tone="0">자연</button>
<button class="tone-btn" data-tone="1">따뜻</button>
<button class="tone-btn" data-tone="2">부드러움</button>
<button class="tone-btn" data-tone="3">밝음</button>
<button class="tone-btn" data-tone="4">거울</button>
</div>
<div id="close">화면 길게 눌러 닫기</div>
</div>
<script>
let stream=null, selectedTone=parseInt(localStorage.getItem('grimo_tone')||'0'), wakeLock=null, cameraTimer=null, pressTimer=null, pressStart=0;
const screen=document.getElementById('screen'), video=document.getElementById('video'), previewVideo=document.getElementById('previewVideo'), picker=document.getElementById('picker'), toneBtns=document.querySelectorAll('.tone-btn');
function applyTone(el,tone){el.className=el.className.replace(/tone-\d/g,'').trim();el.classList.add('tone-'+tone);if(el.id==='video'&&el.classList.contains('show'))el.classList.add('show');}
applyTone(video,selectedTone);
function updateActive(){toneBtns.forEach(b=>b.classList.toggle('active',parseInt(b.dataset.tone)===selectedTone));}
updateActive();
async function lock(){try{if('wakeLock' in navigator)wakeLock=await navigator.wakeLock.request('screen');}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')lock();});
lock();
async function getStream(){if(stream)return stream;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=stream;previewVideo.srcObject=stream;return stream;}catch(e){return null;}}
async function showMirror(){await getStream();if(!stream)return;applyTone(video,selectedTone);video.classList.add('show');if(cameraTimer)clearTimeout(cameraTimer);cameraTimer=setTimeout(()=>{video.classList.remove('show');},3000);}
async function openPicker(){await getStream();applyTone(previewVideo,selectedTone);picker.classList.add('show');video.classList.remove('show');if(cameraTimer)clearTimeout(cameraTimer);}
function closePicker(){picker.classList.remove('show');}
toneBtns.forEach(btn=>{btn.addEventListener('click',(e)=>{e.stopPropagation();selectedTone=parseInt(btn.dataset.tone);localStorage.setItem('grimo_tone',selectedTone);applyTone(previewVideo,selectedTone);applyTone(video,selectedTone);updateActive();});});
screen.addEventListener('touchstart',()=>{pressStart=Date.now();pressTimer=setTimeout(()=>{openPicker();pressTimer=null;},1500);});
screen.addEventListener('touchend',()=>{const d=Date.now()-pressStart;if(pressTimer){clearTimeout(pressTimer);pressTimer=null;if(d<1500)showMirror();}});
screen.addEventListener('touchmove',()=>{if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}});
picker.addEventListener('touchstart',(e)=>{if(e.target.classList.contains('tone-btn'))return;pressStart=Date.now();pressTimer=setTimeout(()=>{closePicker();pressTimer=null;},1500);});
picker.addEventListener('touchend',()=>{if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
